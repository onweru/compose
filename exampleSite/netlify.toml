[build.environment]
GO_VERSION = "1.26.5"
HUGO_VERSION = "0.164.0"
NODE_VERSION = "22.23.1"
URL = "https://composedocs.netlify.app/"
# TZ = "Europe/Oslo"

[build]
publish = "public"
command = """\
  tinacms build &&
  git config core.quotepath false && \
  hugo --gc --minify --baseURL "${URL}"
  """
